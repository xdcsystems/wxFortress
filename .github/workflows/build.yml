name: Build wxFortress

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

env:
  WINLIBS_TAG: 16.2.0posix-23.1.3-14.0.0-ucrt-r3
  WINLIBS_ZIP: winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip

jobs:
  build-win32:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache WinLibs i686 toolchain
        id: cache-winlibs
        uses: actions/cache@v5
        with:
          path: C:\winlibs\mingw32
          key: winlibs-i686-${{ env.WINLIBS_TAG }}

      - name: Download & extract WinLibs i686
        if: steps.cache-winlibs.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path C:\winlibs | Out-Null
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$env:WINLIBS_TAG/$env:WINLIBS_ZIP"
          curl.exe -L --fail --retry 3 -o C:\winlibs\winlibs.zip $url
          7z x C:\winlibs\winlibs.zip -oC:\winlibs -y | Out-Null
          Remove-Item C:\winlibs\winlibs.zip -Force

      - name: Add WinLibs i686 to PATH
        run: |
          "C:\winlibs\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        run: |
          g++ --version
          cmake --version
          ninja --version

      - name: Configure CMake (Ninja + WinLibs i686)
        run: |
          cmake -S . -B ..\wxFortress-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DCMAKE_C_COMPILER=C:/winlibs/mingw32/bin/gcc.exe `
            -DCMAKE_CXX_COMPILER=C:/winlibs/mingw32/bin/g++.exe

      - name: Build wxFortress & tests
        run: |
          cmake --build ..\wxFortress-build --target wxFortress ut_BallPhysics ut_Fortress run_tests -j

      - name: Stage release bundle
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem ..\wxFortress-build\.bin -File | Copy-Item -Destination dist\ -Force
          Get-ChildItem ..\wxFortress-build -Recurse -File -Filter "*.dll" | ForEach-Object {
            if (-not (Test-Path (Join-Path dist $_.Name))) {
              Copy-Item $_.FullName dist\ -Force
            }
          }
          foreach ($rtDll in @("libgcc_s_dw2-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")) {
            $src = Join-Path "C:\winlibs\mingw32\bin" $rtDll
            if (Test-Path $src) {
              Copy-Item $src dist\ -Force
            }
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows x86 artifact
        uses: actions/upload-artifact@v7
        with:
          name: wxFortress-win32
          path: dist/
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Static anti-pattern gate (src/)
        run: |
          python3 - << 'PY'
          import re, sys
          from pathlib import Path

          BANNED = re.compile(
              r'\b(SetThreadPriority|SetPriorityClass|SetThreadAffinityMask|SetProcessAffinityMask|'
              r'TerminateThread|SuspendThread|wxYield|wxClientDC|AddPendingEvent|_POSIX_VER)\b|'
              r'\.detach\s*\(|\bcatch\s*\(\s*\.\.\.\s*\)'
          )
          hits = []
          for p in sorted(Path("src").rglob("*")):
              if p.suffix not in {".cpp", ".cc", ".c", ".h", ".hpp"}:
                  continue
              if "AudioFile" in p.parts:
                  continue
              for idx, line in enumerate(p.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  s = line.strip()
                  if s.startswith("//") or s.startswith("*"):
                      continue
                  if BANNED.search(line):
                      hits.append(f"{p}:{idx}: {s}")
          if hits:
              print("ANTI-PATTERN GATE FAILED:")
              print("\n".join(hits))
              sys.exit(1)
          print("ANTI-PATTERN GATE PASSED (0 findings)")
          PY

      - name: Install Linux build dependencies (for vendored submodules)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config nasm yasm xvfb \
            libgtk-3-dev libgl-dev libglu1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev libpulse-dev libva-dev libvdpau-dev libdrm-dev \
            libgnutls28-dev libaom-dev libass-dev libfreetype-dev libmp3lame-dev \
            libopus-dev libfontconfig-dev libvorbis-dev libvpx-dev libx264-dev libx265-dev libfribidi-dev

      - name: Cache vendored FFmpeg Linux build
        id: cache-ffmpeg
        uses: actions/cache@v5
        with:
          path: external/ffmpeg/linux/.build
          key: ffmpeg-linux-4.3-dec-${{ hashFiles('external/ffmpeg/linux/ffmpeg_4.3.tar.gz') }}

      - name: Build vendored FFmpeg 4.3 (Linux)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ffmpeg_src external/ffmpeg/linux/.build
          tar -xzf external/ffmpeg/linux/ffmpeg_4.3.tar.gz -C /tmp/ffmpeg_src
          FFMPEG_SRC=$(find /tmp/ffmpeg_src -maxdepth 2 -name configure -printf '%h\n' | head -n 1)
          FFMPEG_PREFIX="$PWD/external/ffmpeg/linux/.build"
          cd "$FFMPEG_SRC"
          ./configure \
            --prefix="$FFMPEG_PREFIX" \
            --disable-doc --disable-programs --disable-encoders --disable-muxers \
            --disable-shared --enable-static --enable-pic --enable-gpl \
            --enable-vaapi --enable-libdrm
          make -j"$(nproc)"
          make install

      - name: Configure CMake (Linux vendored submodules)
        run: |
          cmake -S . -B ../wxFortress-build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build wxFortress & tests
        run: |
          xvfb-run -a cmake --build ../wxFortress-build-linux --target wxFortress ut_BallPhysics ut_Fortress run_tests -j

      - name: Stage Linux release bundle
        run: |
          mkdir -p dist-linux
          find ../wxFortress-build-linux/.bin -type f -exec cp -f {} dist-linux/ \;
          find ../wxFortress-build-linux/.lib -maxdepth 3 \( -name '*.so' -o -name '*.so.*' \) -exec cp -a {} dist-linux/ \;
          rm -f dist-linux/libgtest*.so* dist-linux/libgmock*.so*
          ls -la dist-linux

      - name: Build & verify Debian package (.deb)
        run: |
          if [ -f ../wxFortress-build-linux/wxFortress_version.txt ]; then
            . ../wxFortress-build-linux/wxFortress_version.txt
            PKG_VERSION="${WXFORTRESS_VERSION_DEBIAN}"
          else
            PKG_VERSION="1.0.1+git${{ github.run_number }}"
          fi
          PKG_ARCH="$(dpkg --print-architecture)"
          PKG_DIR="/tmp/wxfortress_${PKG_VERSION}_${PKG_ARCH}"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/opt/wxfortress" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/pixmaps"

          cp -a dist-linux/. "$PKG_DIR/opt/wxfortress/"
          chmod 0755 "$PKG_DIR/opt/wxfortress/wxFortress"
          cp -f resources/sample.xpm "$PKG_DIR/usr/share/pixmaps/wxfortress.xpm"

          export PKG_DIR PKG_VERSION PKG_ARCH
          export INSTALLED_KB=$(du -sk "$PKG_DIR/opt" "$PKG_DIR/usr" | awk '{sum+=$1} END{print sum}')
          python3 - <<'PY'
          import os, textwrap
          pkg_dir = os.environ["PKG_DIR"]
          pkg_ver = os.environ["PKG_VERSION"]
          pkg_arch = os.environ["PKG_ARCH"]
          kb = os.environ["INSTALLED_KB"]

          with open(f"{pkg_dir}/usr/bin/wxfortress", "w", newline="\n") as f:
              f.write("#!/bin/sh\ncd /opt/wxfortress || exit 1\nexec ./wxFortress \"$@\"\n")

          with open(f"{pkg_dir}/usr/share/applications/wxfortress.desktop", "w", newline="\n") as f:
              f.write(textwrap.dedent("""\
                  [Desktop Entry]
                  Type=Application
                  Name=wxFortress
                  Comment=Arkanoid-style OpenGL game
                  Exec=/usr/bin/wxfortress
                  Icon=wxfortress
                  Terminal=false
                  Categories=Game;ArcadeGame;
                  """))

          with open(f"{pkg_dir}/DEBIAN/control", "w", newline="\n") as f:
              f.write(textwrap.dedent(f"""\
                  Package: wxfortress
                  Version: {pkg_ver}
                  Section: games
                  Priority: optional
                  Architecture: {pkg_arch}
                  Maintainer: xdcsystems <noreply@github.com>
                  Installed-Size: {kb}
                  Depends: libc6, libstdc++6, libgtk-3-0, libgl1, libx11-6, libasound2 | libasound2t64, libpulse0, libva2, libva-drm2, libva-x11-2, libdrm2, zlib1g, libbz2-1.0, liblzma5
                  Description: Lightweight Arkanoid-style desktop game (OpenGL, wxWidgets, OpenAL, FFmpeg)
                   Cross-platform Arkanoid-style game engineered for low-power and legacy hardware.
                  """))
          PY
          chmod 0755 "$PKG_DIR/usr/bin/wxfortress"
          chmod 0644 "$PKG_DIR/usr/share/applications/wxfortress.desktop"

          mkdir -p dist-deb
          DEB_FILE="dist-deb/wxfortress_${PKG_VERSION}_${PKG_ARCH}.deb"
          dpkg-deb --build --root-owner-group "$PKG_DIR" "$DEB_FILE"
          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE" | head -n 30
          sudo apt-get install -y "./$DEB_FILE"
          test -x /usr/bin/wxfortress
          ldd /opt/wxfortress/wxFortress | grep "not found" && exit 1 || true
          sudo apt-get remove -y wxfortress

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: wxFortress-linux
          path: |
            dist-linux/
            dist-deb/*.deb
          retention-days: 14

  publish-release:
    needs: [ build-win32, build-linux ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          (cd artifacts/wxFortress-win32 && zip -r ../../release-assets/wxFortress-win32.zip .)
          DEB_SRC=$(find artifacts/wxFortress-linux -name '*.deb' | head -n 1)
          if [ -z "$DEB_SRC" ]; then
            echo "ERROR: .deb package not found in wxFortress-linux artifact"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            mv release-assets/wxFortress-win32.zip "release-assets/wxFortress-${TAG}-win32.zip"
            cp -f "$DEB_SRC" "release-assets/$(basename "$DEB_SRC")"
          else
            cp -f "$DEB_SRC" "release-assets/wxfortress_latest_amd64.deb"
          fi
          ls -lh release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release-assets/* --clobber
            else
              gh release create "$TAG" release-assets/* \
                --title "wxFortress ${TAG}" \
                --generate-notes \
                --latest
            fi
          else
            TAG="latest"
            NOTES="Automated rolling build from \`master\` (\`${GITHUB_SHA:0:7}\`). Includes Windows x86 portable zip and Linux amd64 \`.deb\` package."
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null || true
              gh release edit "$TAG" --title "wxFortress (latest)" --notes "$NOTES" --latest
              gh release upload "$TAG" release-assets/* --clobber
            else
              gh release create "$TAG" release-assets/* \
                --target "${GITHUB_SHA}" \
                --title "wxFortress (latest)" \
                --notes "$NOTES" \
                --latest
            fi
          fi

      - name: Archive releases older than latest 10 (keep Git tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          repo = os.environ["GH_REPO"]
          raw = subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp", f"repos/{repo}/releases?per_page=100"],
              text=True,
          )
          pages = json.loads(raw) if raw.strip() else []
          releases = [item for page in pages for item in page]
          versioned = [r for r in releases if r.get("tag_name") != "latest"]
          versioned.sort(key=lambda r: r.get("created_at", ""), reverse=True)

          to_archive = versioned[10:]
          print(f"Versioned releases: {len(versioned)}, archiving (removing release, keeping Git tag): {len(to_archive)}")
          for r in to_archive:
              rid = r["id"]
              tag = r.get("tag_name")
              subprocess.check_call(["gh", "api", "-X", "DELETE", f"repos/{repo}/releases/{rid}"])
              print(f"Archived release {tag} (id={rid}); Git tag preserved.")
          PY
