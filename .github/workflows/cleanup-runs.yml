name: Cleanup old workflow runs

on:
  workflow_run:
    workflows: [ "Build wxFortress" ]
    types: [ completed ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-old-workflow-runs
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune completed workflow runs (keep at most 10 total)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              status: 'completed',
              per_page: 100
            });

            const completed = runs
              .filter(r => r.id !== context.runId)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const kMaxTotal = 10;
            const kMaxCleanup = 2;
            const keepIds = new Set();

            // First keep up to 2 most recent Cleanup runs, then fill remaining slots up to 10 with other workflows (e.g. Build wxFortress).
            let cleanupKept = 0;
            for (const r of completed) {
              if (r.name === 'Cleanup old workflow runs') {
                if (cleanupKept < kMaxCleanup) {
                  keepIds.add(r.id);
                  cleanupKept++;
                }
              }
            }
            for (const r of completed) {
              if (keepIds.size >= kMaxTotal) break;
              if (r.name !== 'Cleanup old workflow runs') {
                keepIds.add(r.id);
              }
            }

            const toDelete = completed.filter(r => !keepIds.has(r.id));
            console.log(`Found ${completed.length} completed runs; keeping ${keepIds.size}, deleting ${toDelete.length}.`);

            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                console.log(`Deleted run ${run.id} [${run.name}] (${run.head_branch} @ ${run.head_sha.slice(0, 7)})`);
              } catch (err) {
                console.log(`Skip run ${run.id}: ${err.message}`);
              }
            }
